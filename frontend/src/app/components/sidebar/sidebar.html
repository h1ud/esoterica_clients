<aside class="sidebar" aria-label="Barra lateral">
  <div class="sidebar__top">
    <a class="brand" [routerLink]="homeRoute()" aria-label="Ir al inicio" (click)="notifyNavigation()">
      <span class="brand__copy">
        <strong>Esotérica</strong>
        <small>Gestión artesanal</small>
      </span>
    </a>

    <button class="sidebar__close" type="button" aria-label="Cerrar navegación" (click)="close()">
      <span class="ui-icon" aria-hidden="true">×</span>
    </button>
  </div>

  <nav class="sidebar-nav" aria-label="Navegación principal">
    @for (link of links(); track link.route) {
      <a
        [routerLink]="link.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
        (click)="notifyNavigation()"
      >
        <span class="ui-icon nav-icon" aria-hidden="true">{{ link.icon }}</span>
        {{ link.label }}
      </a>
    }
  </nav>
</aside>
