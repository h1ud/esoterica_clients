<div class="app-shell" [class.app-shell--sidebar-open]="isSidebarOpen()">
  <app-sidebar
    id="app-sidebar"
    class="app-shell__sidebar"
    (closed)="closeSidebar()"
    (navigated)="closeSidebar()"
  ></app-sidebar>

  @if (isSidebarOpen()) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Cerrar navegación"
      (click)="closeSidebar()"
    ></button>
  }

  <div class="app-shell__body">
    <div class="topbar" aria-label="Herramientas globales">
      <button
        class="menu-button"
        type="button"
        aria-label="Abrir navegación"
        aria-controls="app-sidebar"
        [attr.aria-expanded]="isSidebarOpen()"
        (click)="toggleSidebar()"
      >
        <span class="ui-icon" aria-hidden="true">≡</span>
      </button>

      <label class="topbar-search">
        <span class="ui-icon" aria-hidden="true">⌕</span>
        <span class="sr-only">Buscar</span>
        <input type="search" placeholder="Buscar productos, recetas…" autocomplete="off" />
      </label>

      @if (isPublicSession()) {
        <a class="topbar-login" routerLink="/login">Iniciar sesión</a>
      } @else {
        <div class="topbar-actions">
          <a class="topbar-action" routerLink="/offers" aria-label="Ver carta y ofertas">
            <span class="ui-icon" aria-hidden="true">%</span>
          </a>
          <a class="topbar-action" routerLink="/profile" aria-label="Ver perfil">
            <span class="ui-icon" aria-hidden="true">◉</span>
          </a>
          <div class="topbar-user" aria-label="Sesión actual">
            <span class="topbar-user__avatar" aria-hidden="true">{{ userInitials() }}</span>
            <span class="topbar-user__text">
              <strong>{{ userName() }}</strong>
              <small>{{ roleLabel() }}</small>
            </span>
          </div>
          <button class="topbar-logout" type="button" aria-label="Cerrar sesión" (click)="logout()">
            <span class="ui-icon" aria-hidden="true">↩</span>
            <span>Salir</span>
          </button>
        </div>
      }
    </div>

    <header class="app-shell__header">
      <div class="app-shell__heading">
        @if (eyebrow()) {
          <p class="eyebrow">{{ eyebrow() }}</p>
        }

        <h1>{{ title() }}</h1>

        @if (description()) {
          <p>{{ description() }}</p>
        }
      </div>

      <div class="app-shell__actions">
        <ng-content select="[shell-actions]"></ng-content>
      </div>
    </header>

    <main id="main-content" class="app-shell__main">
      <ng-content></ng-content>
    </main>

    <app-footer variant="portal"></app-footer>
  </div>
</div>
