<main id="main-content" class="auth-page auth-page--login">
  <section class="auth-layout login-layout" aria-labelledby="login-title">
    <div class="auth-brand">
      <h1>Esotérica</h1>
      <p>
        Accede al portal para activar ofertas, revisar beneficios y continuar
        tu recorrido en el atelier.
      </p>

      <figure class="auth-photo">
        <img
          class="auth-image"
          src="https://images.unsplash.com/photo-1519915028121-7d3463d20b13?auto=format&fit=crop&w=880&q=80"
          width="880"
          height="660"
          alt="Tarta artesanal con frutos rojos"
          fetchpriority="high"
        />
        <figcaption>Artesanal</figcaption>
      </figure>
    </div>

    <div class="auth-panel">
      <div class="auth-panel__header">
        <h2 id="login-title">Iniciar sesión</h2>
        <p>Ingresa tu DNI y contraseña para entrar al portal.</p>
      </div>

      <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
        <label class="form-field" for="dni">
          <span>DNI</span>
          <input
            id="dni"
            name="dni"
            type="text"
            inputmode="numeric"
            maxlength="8"
            autocomplete="username"
            placeholder="Ej. 99999999…"
            formControlName="dni"
            spellcheck="false"
            [class.invalid]="hasError('dni')"
          />
        </label>

        <label class="form-field" for="password">
          <span>Contraseña</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Contraseña…"
            formControlName="password"
            [class.invalid]="hasError('password')"
          />
        </label>

        @if (errorMessage()) {
          <p class="form-message form-message--error" role="alert" aria-live="polite">
            {{ errorMessage() }}
          </p>
        }

        <div class="auth-actions">
          <button class="button button--primary" type="submit" [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'Ingresando…' : 'Entrar' }}
            <span class="ui-icon" aria-hidden="true">→</span>
          </button>

          <button class="button button--secondary" type="button" (click)="guestLogin()">
            Ver como invitado
          </button>
        </div>
      </form>

      <p class="auth-footer">
        ¿Aún no tienes cuenta?
        <a routerLink="/register" class="text-link">Crear cuenta</a>
      </p>
    </div>
  </section>

  <app-footer [compact]="true"></app-footer>
</main>
